lockfile:
  format: v13

# Do not enforce minimum release age for dependencies.
# Version selection is delegated to package.json constraints.
minimumReleaseAge: 0

allowBuilds:
  '@carbon/colors': false
  '@carbon/feature-flags': false
  '@carbon/grid': true
  '@carbon/icon-helpers': false
  '@carbon/icons': false
  '@carbon/layout': false
  '@carbon/motion': false
  '@carbon/styles': true
  '@carbon/themes': false
  '@carbon/type': false
  '@carbon/utilities': false
  '@carbon/web-components': true
  '@ibm/plex': false
  '@ibm/plex-mono': true
  '@ibm/plex-sans': true
  '@ibm/plex-sans-arabic': false
  '@ibm/plex-sans-devanagari': false
  '@ibm/plex-sans-hebrew': false
  '@ibm/plex-sans-thai': false
  '@ibm/plex-sans-thai-looped': false
  '@ibm/plex-serif': false
  '@parcel/watcher': true
  unrs-resolver: true
  vue-demi: true

overrides:
  minimatch: '>=11.0.4'

# If you use rust, comment out bellow:
# cargo:
#  enabled: true

# Agent skills
skills:
  dirs:
    - .agents

permissions:
  taze:
    skills: true
